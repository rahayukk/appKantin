name: CI-CD appKantin dengan Notifikasi Telegram

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      # Proteksi Tugas 3 LKPD 9: Pengecekan sintaks PHP
      - name: Cek Linting Sintaks PHP
        run: |
          for f in $(find . -name '*.php'); do
            php -l "$f" || exit 1
          done

      - name: Login ke Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build dan Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/appkantin:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/appkantin:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deployment via SSH ke Swarm Manager
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker service update \
              --image ${{ secrets.DOCKERHUB_USERNAME }}/appkantin:${{ github.sha }} \
              --update-parallelism 1 --update-delay 10s \
              kantin

  notify:
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Kirim Notifikasi Telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            📢 Update Pipeline CI/CD appKantin

            Repository: ${{ github.repository }}
            Commit SHA: ${{ github.sha }}
            Pesan Commit: ${{ github.event.head_commit.message }}

            Status Deployment: ${{ needs.deploy.result == 'success' && 'SUKSES 🟢' || 'GAGAL 🔴' }}
